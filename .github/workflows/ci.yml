name: Python Study App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: uv run python -m py_compile app.py

      - name: Check application import
        run: uv run python -c "import app; print('Application imported successfully')"

      - name: Run tests
        run: uv run pytest -v