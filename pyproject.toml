[project]
name = "azure-subnet-calculator"
version = "0.1.0"
description = "An explanation-first Azure VNet and subnetting study tool"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
